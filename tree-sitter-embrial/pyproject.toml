[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=62.4.0", "wheel" ]

[project]
authors = [ { email = "PARSER_AUTHOR_EMAIL", name = "Adrian Long" } ]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
description = "Embrial grammar for tree-sitter"
keywords = [ "incremental", "parsing", "tree-sitter", "embrial" ]
license.text = "MIT"
name = "tree-sitter-embrial"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[project.urls]
Funding = ""
Homepage = "https://github.com/tree-sitter/tree-sitter-embrial"

[project.optional-dependencies]
core = [ "tree-sitter~=0.24" ]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
